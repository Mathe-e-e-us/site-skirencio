<!DOCTYPE html>
<html>

<body style="background-image: url('ImagemFundo.png'); background-size: cover; background-repeat: no-repeat;">

<table border="1" style="margin: auto;">

    <tr>

        <td style="width: 200px; height: 200px;">
            <img src="logo.png" style="width: 200px; height: 200px">
        </td>

        <td style="width: 500px; height: 200px;">
            <video src="video.mp4" width="500px" loop controls autoplay muted></video>
        </td>

    </tr>


    <tr>

        <td style="width: 200px; height: 500px;">

            <!-- BOTÃO 1 -->
            <a href="#" onclick="document.getElementById('x').innerHTML='<img src=\'TextoUm.png\'>'; return false;">
                <img src="imagemLInk1.png">
            </a>

            <br><br>


            <!-- BOTÃO 2 -->
            <a href="#" onclick="document.getElementById('x').innerHTML='<img src=\'imagemDois.png\'>'; return false;">
                <img src="ImagemLInk2.png">
            </a>

            <br><br>


            <!-- BOTÃO 3 -->
            <a href="#" onclick="mostrarEstrelas(); return false;">
                <img src="imagemLInk3.png">
            </a>

            <br><br>


            <!-- BOTÃO 4 -->
            <a href="#" onclick="mostrarInterruptor(); return false;">
                <img src="imagemLInk4.png">
            </a>

            <br><br>

        </td>


        <!-- CÉLULA DO CONTEÚDO -->
        <td id="x">
        </td>

    </tr>

</table>


<script>


/* BOTÃO 3 */

function mostrarEstrelas() {

    document.getElementById("x").innerHTML = `
    
        <div id="ceu"
        style="
        width: 500px;
        height: 500px;
        background-color: black;
        position: relative;
        "
        onclick="criarEstrela(event)">
        </div>
    
    `;

}


function criarEstrela(event) {

    let estrela = document.createElement("div");

    estrela.innerHTML = "★";

    estrela.style.position = "absolute";

    estrela.style.left = event.offsetX + "px";

    estrela.style.top = event.offsetY + "px";

    estrela.style.color = "white";

    estrela.style.fontSize = (Math.random() * 5 + 5) + "px";

    estrela.style.transform = "rotate(" + (Math.random() * 360) + "deg)";

    document.getElementById("ceu").appendChild(estrela);

}


/* BOTÃO 4 */

function mostrarInterruptor() {

    document.getElementById("x").innerHTML = `
    
        <img 
        src="imagemBotao.png" 
        width="80"
        onclick="trocarTema(this)"
        >
    
    `;

}


function trocarTema(imagem) {

    if (imagem.src.includes("imagemBotao.png")) {

        imagem.src = "imagemBotao2.png";

        document.body.style.backgroundImage = "url('ImagemFundo2.png')";

    } else {

        imagem.src = "imagemBotao.png";

        document.body.style.backgroundImage = "url('ImagemFundo.png')";

    }

}

</script>

</body>
</html>
